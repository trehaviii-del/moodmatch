<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodMatch — Movie or series?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 40px 20px;
        }

        .container { text-align: center; max-width: 700px; width: 100%; }

        .context-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px;
        }

        .ctx-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 30px;
            padding: 7px 16px;
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .ctx-badge .emoji { font-size: 1.1rem; }
        .ctx-badge .hi    { font-weight: 600; color: #e94560; }
        .ctx-badge .plus  { color: #4a5568; margin: 0 2px; }

        h2 { font-size: 2rem; margin-bottom: 12px; }
        .subtitle { font-size: 1rem; color: #718096; margin-bottom: 44px; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 36px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #fff;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .option-btn:hover {
            background: rgba(123, 94, 167, 0.2);
            border-color: #7b5ea7;
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(123, 94, 167, 0.3);
        }

        .option-btn .emoji { font-size: 2.8rem; }
        .option-btn .title { font-size: 1.2rem; font-weight: 700; }
        .option-btn .desc  { font-size: 0.82rem; color: #718096; line-height: 1.4; }

        .back-link {
            display: inline-block;
            margin-top: 36px;
            color: #4a5568;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #a0aec0; }

        @media (max-width: 560px) {
            .options-grid { grid-template-columns: 1fr; max-width: 320px; margin: 0 auto; }
            h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="context-row">
        <span class="ctx-badge">
            <span class="emoji" th:text="${mood.emoji}"></span>
            <span class="hi" th:text="${mood.displayName}"></span>
        </span>
        <span class="ctx-badge" th:if="${secondMood != null}">
            <span class="plus">+</span>
            <span class="emoji" th:text="${secondMood.emoji}"></span>
            <span class="hi" th:text="${secondMood.displayName}"></span>
        </span>
        <span class="ctx-badge" th:if="${format != null}">
            <span class="emoji" th:text="${format.emoji}"></span>
            <span th:text="${format.displayName}"></span>
        </span>
    </div>

    <h2>Movie or series?</h2>
    <p class="subtitle">Choose a structure and we'll narrow it down.</p>

    <div class="options-grid">
        <form th:each="ct : ${contentTypes}" method="post" action="/select-genres" style="display:contents">
            <input type="hidden" name="mood"       th:value="${mood.name()}"/>
            <input type="hidden" name="secondMood" th:value="${secondMood != null ? secondMood.name() : ''}"/>
            <input type="hidden" name="format"     th:value="${format != null ? format.name() : ''}"/>
            <input type="hidden" name="contentType" th:value="${ct.name()}"/>
            <button type="submit" class="option-btn">
                <span class="emoji" th:text="${ct.emoji}"></span>
                <span class="title" th:text="${ct.displayName}"></span>
                <span class="desc"  th:text="${ct.description}"></span>
            </button>
        </form>
    </div>

    <a th:href="@{/select-format(mood=${mood.name()}, secondMood=${secondMood != null ? secondMood.name() : ''})}"
       class="back-link">← Back</a>
</div>
</body>
</html>
